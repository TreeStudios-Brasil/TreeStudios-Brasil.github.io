let rows=state.listings.filter(x=>saved?x.isSaved:(state.category==='Todos'||x.category===state.category)&&norm(x.title+' '+x.category).includes(norm(state.query))&&(state.max===null||x.priceCents<=state.max)&&(!x.location||state.region==='Sua região'||norm(x.location).includes(norm(state.region))));if(home&&state.sort!=='recent')rows.sort((a,b)=>state.sort==='low'?a.priceCents-b.priceCents:b.priceCents-a.priceCents);$('count').textContent=rows.length+' '+(rows.length===1?'serviço':'serviços');$('grid').innerHTML=rows.length?rows.map(x=>`<article class="listing"><button class="open-card" data-detail="${esc(x.id)}" aria-label="Ver ${esc(x.title)}"><span style="display:block;width:100%">${picture(x)}</span><span class="cardbody"><span class="category">${esc(x.category)}</span><span class="listing-title">${esc(x.title)}</span><span class="meta">${icon('pin')}${esc(x.location||'Local não informado')}</span><span class="price">${money(x.priceCents)}</span></span></button><button class="save" aria-label="${x.isSaved?'Remover dos salvos':'Salvar serviço'}: ${esc(x.title)}" aria-pressed="${x.isSaved}" data-save="${esc(x.id)}">${icon('heart')}</button></article>`).join(''):`<div class="empty" style="grid-column:1/-1"><h3>${saved?'Nenhum serviço salvo':'Nenhum serviço encontrado'}</h3><p>${saved?'Toque no coração de um anúncio para guardar aqui.':'Experimente outra categoria ou altere os filtros.'}</p><button class="secondary" id="emptyAction">${saved?'Explorar serviços':'Limpar filtros'}</button></div>`;if($('emptyAction'))$('emptyAction').onclick=()=>{state.query='';$('query').value='';state.category='Todos';state.max=null;tab('home')}}
function tab(t){state.tab=t;render();$('main').scrollTop=0}function sheet(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;decorate($('dialogBody'));if(!$('sheet').open)$('sheet').showModal()}function close(){$('sheet').close()};$('close').onclick=close;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet')){let r=$('sheet').getBoundingClientRect();if(e.clientY<r.top)close()}});
$('query').oninput=e=>{state.query=e.target.value;render()};$('chips').onclick=e=>{let b=e.target.closest('[data-cat]');if(b){state.category=b.dataset.cat;render();[...$('chips').children].find(c=>c.dataset.cat===state.category)?.scrollIntoView({block:'nearest',inline:'nearest'})}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('grid').onclick=e=>{let b=e.target.closest('[data-save]');if(b){let x=state.listings.find(x=>x.id===b.dataset.save);x.isSaved=!x.isSaved;render();toast(x.isSaved?'Serviço salvo':'Serviço removido dos salvos');[...$('grid').querySelectorAll('[data-save]')].find(y=>y.dataset.save===x.id)?.focus();return}b=e.target.closest('[data-detail]');if(b)detail(state.listings.find(x=>x.id===b.dataset.detail))};
function detail(x){sheet(x.title,`${picture(x)}<p>${esc(x.category)} · ${esc(x.location||'Local não informado')}</p><h2 style="color:var(--primary);margin-bottom:12px">${money(x.priceCents)}</h2><p>Valor e disponibilidade devem ser confirmados com o profissional.</p><button class="primary" id="contact">Entrar em contato</button>`);$('contact').onclick=()=>{close();toast('Demonstração: nenhum contato real foi iniciado.')}}
$('filter').onclick=()=>{sheet('Filtrar serviços',`<form id="filterForm"><label>Categoria<select name="category">${cats.map(c=>`<option ${state.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Preço máximo (R$)<input name="max" type="number" min="0" step="0.01" placeholder="Sem limite" value="${state.max===null?'':state.max/100}"></label><button class="primary">Aplicar filtros</button><button type="button" class="secondary" id="clear">Limpar filtros</button></form>`);$('filterForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.category=f.get('category');state.max=f.get('max')===''?null:Math.round(Number(f.get('max'))*100);close();render();toast('Filtros aplicados')};$('clear').onclick=()=>{state.category='Todos';state.max=null;close();render()}};
$('sort').onclick=()=>{sheet('Ordenar anúncios',`<form id="sortForm"><label>Ordenar por<select name="order">${[['recent','Mais recentes'],['low','Menor preço'],['high','Maior preço']].map(([v,t])=>`<option value="${v}" ${state.sort===v?'selected':''}>${t}</option>`).join('')}</select></label><button class="primary">Aplicar</button></form>`);$('sortForm').onsubmit=e=>{e.preventDefault();state.sort=new FormData(e.target).get('order');close();render()}};
$('location').onclick=()=>{sheet('Escolher região','<p>Informe sua cidade manualmente. Os anúncios da captura não têm localização confirmada.</p><form id="regionForm"><label>Cidade ou região<input name="region" required maxlength="60" placeholder="Ex.: Sorocaba"></label><button class="primary">Salvar região</button><button type="button" class="secondary" id="resetRegion">Todas as regiões</button></form>');$('regionForm').onsubmit=e=>{e.preventDefault();state.region=new FormData(e.target).get('region').trim()||'Sua região';$('locationLabel').textContent=state.region;close();render();toast('Região atualizada na demonstração')};$('resetRegion').onclick=()=>{state.region='Sua região';$('locationLabel').textContent=state.region;close();render()}};
$('notifications').onclick=()=>sheet('Notificações','<div class="empty"><h3>Nenhuma notificação de demonstração</h3><p>Novidades sobre seus anúncios apareceriam aqui.</p></div>');
function publish(){sheet('Criar anúncio',`<form id="publishForm"><label>Título do serviço<input name="title" required maxlength="80" placeholder="Ex.: Instalação elétrica"></label><label>Categoria<select name="cat">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label><label>Preço (R$)<input name="price" required type="number" min="0" step="0.01"></label><label>Cidade<input name="city" maxlength="60" placeholder="Opcional"></label><button class="primary">Publicar na demonstração</button></form>`);$('publishForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),title=f.get('title').trim();if(!title)return;state.listings.unshift({id:String(Date.now()),title,category:f.get('cat'),priceCents:Math.round(Number(f.get('price'))*100),location:f.get('city').trim()||null,isSaved:false});state.category='Todos';state.query='';$('query').value='';state.max=null;state.sort='recent';close();tab('home');toast('Anúncio adicionado à demonstração')}}$('publish').onclick=publish;render();
</script></body></html>
